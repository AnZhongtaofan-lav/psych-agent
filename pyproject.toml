# ============================================================
# AI 心理服务智能体 —— 项目元数据与依赖声明
#
# 说明：
# - 本项目为三层架构（交互层/逻辑层/数据层）的心理服务智能体
# - 安全红线：高危拦截不依赖 LLM；PII 默认脱敏；误报优于漏报
# ============================================================

[project]
name = "psych-agent"                      # 包名
version = "0.1.0"                         # 初始版本
description = "AI 心理服务智能体：三层架构（交互层/逻辑层/数据层），含情绪识别、四级风险分级与高危拦截、全链路 PII 脱敏"
requires-python = ">=3.11"                # 依赖 Python 3.11+（tomllib、asyncio 特性）
dependencies = [
    "fastapi>=0.110.0",                   # Web 框架（交互层）
    "uvicorn[standard]>=0.29.0",          # ASGI 服务器
    "pydantic>=2.6.0",                    # 数据校验（schema 层）
    "httpx>=0.27.0",                      # LLM HTTP 客户端（可插拔增强）
    "python-multipart>=0.0.9",            # multipart 上传支持（摄像头媒体文件）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",                      # 测试框架
    "pytest-asyncio>=0.23.0",             # 异步测试支持
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]                        # 只打包 app 包

# ============================================================
# pytest 配置：测试目录与根目录
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ============================================================
# uvicorn 启动脚本：pip install -e . 后可直接 psych-server 启动
# ============================================================
[project.scripts]
psych-server = "app.main:run"
